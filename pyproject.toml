[tool.ruff]
line-length = 100
exclude = ["pytest.ini", "*.ipynb"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "BLE", "B"]
ignore = ["UP035"]

[tool.ruff.lint.per-file-ignores]
# Long physical lines inside prompt/canned-text literals (E501 not applicable to string content)
"src/persona.py" = ["E501"]
"src/pipeline.py" = ["E501"]
"evaluation/llm_judge.py" = ["E501"]